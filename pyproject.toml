[project]
name = "hugggingfce-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.3",
    "huggingface-hub>=0.36.2",
    "logging>=0.4.9.6",
    "playwright>=1.59.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.26",
    "smolagents[litellm]>=1.24.0",
    "uvicorn>=0.44.0",
]

[tool.uv]
package = false

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
